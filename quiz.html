<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz · Lab 4</title><link rel="stylesheet" href="assets/site.css"></head><body><header><strong>Lab 4 / Quiz</strong><nav><a href="index.html">Course</a><a href="lab.html">Interactive lab</a><a href="handout.html">Handout</a></nav></header><main><h1>Check your understanding</h1><p class="lede">Six questions about the algorithm and its limits. Answer all questions, then review the explanations.</p><form id="quiz"></form><button id="grade">Check answers</button><p id="result" class="feedback" aria-live="polite"></p><p class="muted">This is a new local quiz. It does not submit answers or scores to the original course.</p></main><script>
const questions=[
 {q:'After merging A and B in the original graph, what is affinity(AB,C)?',choices:['4: use the strongest edge','5: add AC and BC','1: use the weakest edge','0: contracted nodes have no edges'],answer:1,why:'AC=1 and BC=4 connect the two current clusters, so their sum is 5.'},
 {q:'Which report is correct for K=2 and capacity=2?',choices:['2 clusters, cutsize 8, target reached','3 clusters, cutsize 8, capacity compliant, target not reached','3 clusters, cutsize 3, target reached','2 clusters, cutsize 3, capacity compliant'],answer:1,why:'AB | C | DE has sizes 2,1,2 and cutsize 8. Three clusters remain, so K=2 is not reached.'},
 {q:'The strongest positive-affinity candidate exceeds capacity. What should the algorithm do?',choices:['Merge anyway to reach K','Stop immediately','Check lower-ranked candidates for a legal merge','Delete the original edge permanently'],answer:2,why:'A blocked candidate is skipped. Another legal positive-affinity pair may exist.'},
 {q:'Why does capacity 2 increase cutsize from 3 to 8 in the original example?',choices:['The AB and DE weights increase','AC and BC become cross-cluster edges','All six edges are counted twice','Node sizes are added to cutsize'],answer:1,why:'C stays separate from AB, so AC+BC=1+4=5 is added to the cut.'},
 {q:'A run stops above K. What can you conclude in general?',choices:['The target is always infeasible','The target is always feasible','Only that this run found no further legal positive-affinity merge','The current cutsize is globally optimal'],answer:2,why:'The five-node cap-2 target is infeasible, but the size-2,2,1,1 counterexample has a feasible partition that greedy misses.'},
 {q:'Which statement about greedy clustering is correct?',choices:['It always minimizes final cutsize','Reaching K implies global optimality','A deterministic tie-break removes every optimization limitation','It makes the best immediate legal affinity choice, without a global guarantee'],answer:3,why:'The four-node example returns cutsize 18, while another legal partition has cutsize 11.'}
];document.querySelector('#quiz').innerHTML=questions.map((q,i)=>`<div class="q"><div class="question-text">${i+1}. ${q.q}</div>${q.choices.map((c,j)=>`<label><input type="radio" name="q${i}" value="${j}">${c}</label>`).join('')}<p id="explain-${i}" aria-live="polite"></p></div>`).join('');document.querySelector('#grade').onclick=()=>{let score=0;questions.forEach((q,i)=>{let chosen=document.querySelector(`input[name="q${i}"]:checked`);let ok=chosen&&Number(chosen.value)===q.answer;if(ok)score++;document.querySelector('#explain-'+i).textContent=(ok?'Correct. ':chosen?'Not quite. ':'No answer selected. ')+q.why;});document.querySelector('#result').textContent=`${score} / ${questions.length} correct`;};
</script></body></html>
