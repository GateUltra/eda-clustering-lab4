<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 4 · Size-constrained agglomerative clustering</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dfe5e9;font-family:Arial,Helvetica,sans-serif;color:#122a3a}#slide{width:1280px;height:720px;background:#f7f8f4;position:relative;transform-origin:top left;overflow:hidden}.topline{position:absolute;top:0;left:0;right:0;height:7px;background:#087e83}.eyebrow{position:absolute;top:35px;left:58px;font-size:16px;font-weight:bold;letter-spacing:2px;color:#087e83}h1{position:absolute;left:56px;top:57px;margin:0;font-size:40px;line-height:1.13;white-space:pre-line;letter-spacing:-1px;max-width:1160px}.content{position:absolute;left:58px;right:58px;top:154px;height:377px;display:flex;gap:45px;align-items:center}.text{flex:1}.point{font-size:25px;line-height:1.35;margin:19px 0;padding-left:18px;border-left:3px solid #b9d8d6}.point:first-child{margin-top:0}.point:last-child{margin-bottom:0}.graphic{flex:0 0 530px}svg{width:100%;height:330px;overflow:visible}.metric{font-size:24px;line-height:1.3;font-weight:bold;color:#087e83;margin-top:6px;text-align:center}.footer{position:absolute;top:554px;left:58px;right:58px;display:flex;justify-content:space-between;color:#526572;font-size:14px;border-top:1px solid #ced9db;padding-top:12px}.caption-space{position:absolute;top:593px;bottom:0;width:100%;background:#102b3b}.caption-space:empty:after{content:' ';}#controls{position:fixed;bottom:8px;right:12px;display:flex;gap:8px;z-index:5}button,a{font:16px Arial;color:#fff;background:#087e83;border:0;padding:10px 15px;border-radius:4px;cursor:pointer;text-decoration:none}button:disabled{opacity:.45}.cover h1{top:128px;font-size:56px;max-width:1110px}.cover .content{top:332px;height:165px;width:1000px}.cover .point{font-size:29px}.cover .eyebrow{top:65px}.big{font-size:62px;font-weight:bold;color:#087e83;line-height:1.15}.formula{font-size:38px;line-height:1.5;margin:24px 0}.sub{font-size:21px;color:#536b74;line-height:1.5}table{border-collapse:collapse;width:100%;font-size:23px}th,td{text-align:left;padding:16px 18px;border-bottom:1px solid #d6dfe1}th{font-size:17px;color:#526572;font-weight:normal}tr.accent td{background:#e1efeb}.comparison .content{display:block;top:144px}.comparison .point{font-size:23px;margin-top:21px}.code .content,.rules .content{align-items:flex-start}.code .point,.rules .point{margin:16px 0}.code pre{font:22px/1.55 monospace;background:#e8efee;padding:24px;margin:0;width:530px}.trap .point,.optimal .point{font-size:27px;margin:24px 0}.definitions .point{font-size:29px;margin:27px 0}.recap .point{font-size:31px;margin:27px 0}.chapter{font-size:23px;color:#536b74}.infeasible .graphic{flex-basis:400px;text-align:center}.tag{color:#087e83;font-size:22px;margin-top:12px}.render #controls{display:none}.render #slide{transform:none!important}.print #controls{display:none}@media print{body{background:white}#slide{break-after:page;transform:none!important}#controls{display:none}}
</style><div id="slide" aria-live="polite"></div><div id="controls"><a href="index.html">Course</a><button id="prev">← Previous</button><button id="listen">Listen</button><button id="next">Next →</button></div>
<script>
const LESSON=/*LESSON_DATA*/;
const colors=['#087e83','#c17424','#6b65a8','#366fad','#996458'];
const E=[['A','B',5],['A','C',1],['B','C',4],['C','D',2],['C','E',1],['D','E',5]];
const esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function graph(s,contract=false){
 let pos=contract?{AB:[85,185],C:[285,185],D:[480,65],E:[480,305]}:{A:[75,65],B:[75,305],C:[275,185],D:[475,65],E:[475,305]};
 let edges=contract?[['AB','C',5],['C','D',2],['C','E',1],['D','E',5]]:E;
 let out='<svg viewBox="0 0 550 370" role="img" aria-label="Weighted graph with labeled nodes and edges">';
 for(let [u,v,w] of edges){let [x1,y1]=pos[u],[x2,y2]=pos[v];let hi=contract?u==='AB':(s.highlight||[]).includes(u+v);let mx=(x1+x2)/2,my=(y1+y2)/2; if(x1===x2)mx-=28;else my-=16;
 out+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${hi?'#d08424':'#a9b8bf'}" stroke-width="${hi?6:3}"/><rect x="${mx-15}" y="${my-17}" width="30" height="32" rx="6" fill="#f7f8f4"/><text x="${mx}" y="${my+7}" text-anchor="middle" font-size="25" font-weight="bold" fill="${hi?'#a75f12':'#526572'}">${w}</text>`;
 }
 for(let [n,[x,y]] of Object.entries(pos)){let gi=(s.groups||['AB','C','D','E']).findIndex(g=>g.includes(n));let c=colors[Math.max(0,gi)];out+=`<circle cx="${x}" cy="${y}" r="35" fill="${c}"/><text x="${x}" y="${y+9}" text-anchor="middle" fill="white" font-size="27" font-weight="bold">${n}</text>`;}
 return out+'</svg>';
}
let current=0;const audio=new Audio();
function showSlide(i){audio.pause();current=Math.max(0,Math.min(LESSON.length-1,i));const s=LESSON[current];let text='<div class="text">'+s.points.map(p=>'<div class="point">'+esc(p)+'</div>').join('')+'</div>';let graphic='';
 if(s.kind==='graph'||s.kind==='contract')graphic='<div class="graphic">'+graph(s,s.kind==='contract')+(s.metric?'<div class="metric">'+esc(s.metric)+'</div>':'')+'</div>';
 if(s.kind==='infeasible')graphic='<div class="graphic"><div class="big">5 &gt; 2 × 2</div><p class="sub">required size &gt; available capacity</p><div class="formula">3 clusters remain</div><div class="tag">target reached: false</div></div>';
 if(s.kind==='code')graphic='<pre>clusters = singletons\nwhile count &gt; K:\n    rank positive pairs\n    choose strongest legal pair\n    if none: break\n    contract and update\nreport actual outcomes</pre>';
 if(s.kind==='comparison')text=`<table><thead><tr><th>TARGET K</th><th>CAPACITY</th><th>PARTITION</th><th>CUTSIZE</th><th>REACHED?</th></tr></thead><tbody><tr class="accent"><td>2</td><td>2</td><td>AB | C | DE</td><td>8</td><td>No · 3 clusters</td></tr><tr><td>2</td><td>3</td><td>ABC | DE</td><td>3</td><td>Yes</td></tr><tr><td>2</td><td>None</td><td>ABC | DE</td><td>3</td><td>Yes</td></tr><tr><td>3</td><td>2</td><td>AB | C | DE</td><td>8</td><td>Yes</td></tr></tbody></table><div class="point">The difference is AC + BC = 1 + 4 = 5.</div>`;
 document.querySelector('#slide').className=s.kind;
 document.querySelector('#slide').innerHTML=`<div class="topline"></div><div class="eyebrow">${esc(s.subtitle)}</div><h1>${esc(s.title)}</h1><div class="content">${text}${graphic}</div><div class="footer"><span>Clustering for EDA · Lab 4</span><span>${String(s.id).padStart(2,'0')} / ${LESSON.length}</span></div><div class="caption-space"></div>`;
 document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===LESSON.length-1;document.querySelector('#listen').textContent='Listen';window.slideReady=s.id;
}
window.showSlide=showSlide;window.LESSON=LESSON;
function resize(){if(!document.body.classList.contains('render'))document.querySelector('#slide').style.transform=`scale(${Math.min(innerWidth/1280,(innerHeight-55)/720)})`;}
const params=new URLSearchParams(location.search);if(params.has('render'))document.body.classList.add('render');
showSlide(Number(params.get('slide')||1)-1);resize();addEventListener('resize',resize);
document.querySelector('#prev').onclick=()=>showSlide(current-1);document.querySelector('#next').onclick=()=>showSlide(current+1);
document.querySelector('#listen').onclick=()=>{if(!audio.paused){audio.pause();document.querySelector('#listen').textContent='Listen';return;}audio.src=`media/audio/slide-${String(current+1).padStart(2,'0')}.mp3`;audio.play();document.querySelector('#listen').textContent='Pause';};audio.onended=()=>document.querySelector('#listen').textContent='Listen';
addEventListener('keydown',e=>{if(e.key==='ArrowRight')showSlide(current+1);if(e.key==='ArrowLeft')showSlide(current-1)});
</script></html>
